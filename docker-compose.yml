services:
  backend:
    image: python:3.12-slim
    working_dir: /workspace
    env_file: .env
    volumes:
      - .:/workspace
    command: sh -c "pip install --no-cache-dir -e '.[dev]' && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --app-dir backend"
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    image: node:22-alpine
    working_dir: /workspace/frontend
    volumes:
      - .:/workspace
      - frontend_node_modules:/workspace/frontend/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend

volumes:
  frontend_node_modules:
